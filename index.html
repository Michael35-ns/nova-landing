    <title>Empresa de Construcción y Remodelación en Costa Rica | NOVOSTI</title>

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:site_name" content="NOVOSTI" />
    <meta
      property="og:title"
      content="Construcción y remodelación en Costa Rica | NOVOSTI" />

      content="Ingeniería, construcción, remodelación y telecomunicaciones con dirección técnica. 15 años de experiencia y más de 700 proyectos en las 7 provincias de Costa Rica." />

      name="twitter:title"
      content="Construcción y remodelación en Costa Rica | NOVOSTI" />

      name="twitter:description"
      content="Ingeniería, construcción, remodelación y telecomunicaciones con dirección técnica en Costa Rica." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Datos estructurados. Mantener el teléfono, correo, dominio y redes
      sincronizados con src/siteConfig.ts (única fuente de la información NAP).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "@id": "https://www.novosti.com/#organization",
        "name": "NOVOSTI",
        "url": "https://www.novosti.com/",
        "image": "https://www.novosti.com/assets/og-novosti.jpg",
        "logo": "https://www.novosti.com/assets/novosti-logo.png",
        "description": "Empresa de construcción, remodelación, obra civil, mantenimiento de infraestructura e infraestructura de telecomunicaciones en Costa Rica, con dirección técnica y gestión integral de proyectos.",
        "telephone": "+506 6064 1906",
        "email": "proyectos@novosti.com",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "San José",
          "addressCountry": "CR"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Costa Rica"
        },
        "foundingDate": "2011",
        "slogan": "Ingeniería que planifica. Construcción que transforma. Proyectos que generan valor.",
        "knowsAbout": [
          "Construcción",
          "Remodelación",
          "Obra civil",
          "Mantenimiento de infraestructura",
          "Infraestructura de telecomunicaciones",
          "Torres autosoportadas",
          "Obras electromecánicas"
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "18:00"
          }
        ]
      }
    </script>
